name: Pylint

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint 'pytest==8.3.4' 'pytest-asyncio==0.25.2'
      - name: Analysing the code with pylint
        env:
          PYTHONPATH: .
        run: |
          # App targets 3.12 (PEP 604 unions). Lint app package only — not tests.
          # duplicate-code, cyclic-import and import-error stay as they were.
          # Line length stays enforced; 120 matches the long data strings already in the desk.
          pylint app \
            --fail-under=9 \
            --max-line-length=120 \
            --disable=duplicate-code,cyclic-import,import-error \
            --ignore-paths='^app/static'
      - name: Pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=line
