name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint
      - name: Analysing the code with pylint
        env:
          PYTHONPATH: .
        run: |
          # App targets 3.12 (PEP 604 unions). Lint app package only — not tests —
          # and ignore noisy duplicate/cyclic refactor warnings that predate this desk stack.
          pylint app \
            --fail-under=7.5 \
            --disable=duplicate-code,cyclic-import,import-error \
            --ignore-paths='^app/static'
