<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Cykliczny Trader Kar Digital — ucz się rynków przez cykle (edukacja, nie broker)" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cykliczny Trader" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23000000' width='192' height='192' rx='8'/%3E%3Ccircle cx='96' cy='96' r='22' fill='none' stroke='%23ffffff' stroke-width='4'/%3E%3Cellipse cx='96' cy='96' rx='72' ry='26' fill='none' stroke='rgba(255,255,255,0.5)' stroke-width='3' transform='rotate(-18 96 96)'/%3E%3C/svg%3E" />
    <title>Cykliczny Trader · Kar Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #050505; color: #e8e8e8; }
      #root { min-height: 100vh; }
      #boot-shell {
        font-family: Manrope, system-ui, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; gap: 12px; letter-spacing: 0.04em;
      }
      #boot-shell strong { font-size: 1.15rem; font-weight: 700; }
      #boot-shell span { opacity: 0.65; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" aria-live="polite">
        <strong>Cykliczny Trader</strong>
        <span>Ładowanie…</span>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var shell = document.getElementById('boot-shell');
        if (shell) {
          shell.innerHTML = '<strong>Cykliczny Trader</strong><span>Błąd ładowania — odśwież (Cmd+Shift+R)</span>';
        }
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        var shell = document.getElementById('boot-shell');
        if (root && shell && root.contains(shell) && root.children.length === 1) {
          shell.innerHTML = '<strong>Cykliczny Trader</strong><span>Aplikacja nie wystartowała — twarde odświeżenie (Cmd+Shift+R)</span>';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
