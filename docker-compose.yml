# Cykliczny Trader · Kar Digital
# Strona: http://localhost:8080  (frontend proxy → backend /api)
# Sekrety tylko z pliku .env. Auto-X jest włączone, ale nie wyśle posta
# bez https na CYCLICAL_PUBLIC_BASE_URL (własna domena).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cyclical-trader-backend:latest
    container_name: cyclical-trader-backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      CYCLICAL_DATABASE_PATH: /data/db/trader.db
      CYCLICAL_PORTFOLIO_DATABASE_PATH: /data/portfolio/portfolio.db
      CYCLICAL_PORTFOLIO_RESTORE_BACKUP: "false"
      # Auto-X włączone w kodzie. Żywy wpis czeka na własną domenę https i DRY_RUN=false.
      CYCLICAL_SOCIAL_AUTO_POST: "${CYCLICAL_SOCIAL_AUTO_POST:-true}"
      CYCLICAL_SOCIAL_DRY_RUN: "${CYCLICAL_SOCIAL_DRY_RUN:-true}"
      CYCLICAL_BINANCE_AI_BOT_DRY_RUN: "${CYCLICAL_BINANCE_AI_BOT_DRY_RUN:-true}"
      # Puste = zmiany stanu zwracają 403. Ustaw w .env, nie w tym pliku.
      CYCLICAL_DESK_TOKEN: "${CYCLICAL_DESK_TOKEN:-}"
      # Nginx i Caddy siedzą w sieci Dockera. Pusty poza compose = brak zaufania do X-Forwarded-For.
      CYCLICAL_TRUSTED_PROXIES: ${CYCLICAL_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      # Pętla Solana Desk jest osobną usługą. API tylko czyta dziennik.
      SOLANA_DESK_AUTOSTART: "false"
    volumes:
      # Baza SQLite: alerty, newsy i dziennik decyzji (tabela social_decisions).
      - trader-db:/data/db
      # Ten sam folder co lokalny uvicorn na Macu (backend/data/baza_portfela).
      - ./backend/data/baza_portfela:/data/portfolio
      # Cache notowań, grafiki newsów i pliki pomocnicze.
      - app-cache:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "gosu",
          "app",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','8000'), timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: cyclical-trader-frontend:latest
    container_name: cyclical-trader-frontend
    # Lokalnie i w profilu public: tylko pętla zwrotna. Świat wchodzi przez Caddy (80/443).
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # Public HTTPS. Start with: docker compose --profile public up -d
  # Set CYCLICAL_SITE_DOMAIN to the real hostname. Caddy fetches the certificate.
  proxy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Empty unless the public profile is used. The entrypoint refuses to start Caddy without it.
      SITE_DOMAIN: ${CYCLICAL_SITE_DOMAIN:-}
      CYCLICAL_CADDY_BASIC_USER: ${CYCLICAL_CADDY_BASIC_USER:-}
      CYCLICAL_CADDY_BASIC_HASH: ${CYCLICAL_CADDY_BASIC_HASH:-}
    volumes:
      - ./deploy/caddy-entrypoint.sh:/caddy-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    depends_on:
      frontend:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # Papierowy handel memecoinami. Przetrwa restart. Klucz portfela tylko z .env.
  solana-desk:
    image: cyclical-trader-backend:latest
    container_name: cyclical-trader-solana-desk
    env_file:
      - path: .env
        required: false
    environment:
      CYCLICAL_DATABASE_PATH: /data/db/trader.db
      CYCLICAL_PORTFOLIO_DATABASE_PATH: /data/portfolio/portfolio.db
      SOLANA_REAL_TRADING: "${SOLANA_REAL_TRADING:-false}"
      SOLANA_DESK_AUTOSTART: "true"
    command: ["python", "-m", "app.solana_desk.worker"]
    volumes:
      - trader-db:/data/db
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default-logging
    restart: unless-stopped

volumes:
  trader-db:
  app-cache:
  caddy-data:
  caddy-config:
