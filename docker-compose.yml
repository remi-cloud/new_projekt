services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CYCLICAL_SCAN_INTERVAL_MINUTES=15
      - CYCLICAL_ALERTS_ENABLED=${CYCLICAL_ALERTS_ENABLED:-false}
      - CYCLICAL_NTFY_TOPIC=${CYCLICAL_NTFY_TOPIC:-}
      - CYCLICAL_WEBHOOK_URL=${CYCLICAL_WEBHOOK_URL:-}
    volumes:
      - trader-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  trader-data:
