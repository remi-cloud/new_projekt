services:
  www:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CYCLICAL_SCAN_INTERVAL_MINUTES=5
      - CYCLICAL_PRICE_POLL_INTERVAL_SECONDS=30
      - CYCLICAL_ALERT_PHONE_NUMBER=
    volumes:
      - trader-data:/app/data
      - portfolio-data:/app/data/baza_portfela
    restart: unless-stopped

volumes:
  trader-data:
  portfolio-data:
