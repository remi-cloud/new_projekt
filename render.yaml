services:
  - type: web
    name: cyclical-trader-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CYCLICAL_SCAN_INTERVAL_MINUTES
        value: "15"
      - key: CYCLICAL_DATABASE_PATH
        value: /var/data/trader.db
      - key: CYCLICAL_ALERTS_ENABLED
        value: "false"
      - key: CYCLICAL_NTFY_TOPIC
        sync: false
      - key: CYCLICAL_WEBHOOK_URL
        sync: false
    disk:
      name: cyclical-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: cyclical-trader-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://cyclical-trader-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
