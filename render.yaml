# Single WWW service: React SPA + FastAPI API on one URL
services:
  - type: web
    name: cyclical-trader
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CYCLICAL_SCAN_INTERVAL_MINUTES
        value: "15"
      - key: CYCLICAL_DATABASE_PATH
        value: /var/data/trader.db
      - key: CYCLICAL_ALERTS_ENABLED
        value: "false"
      - key: CYCLICAL_NTFY_TOPIC
        sync: false
      - key: CYCLICAL_WEBHOOK_URL
        sync: false
    disk:
      name: cyclical-data
      mountPath: /var/data
      sizeGB: 1
