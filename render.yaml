services:
  - type: web
    name: cyclical-trader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CYCLICAL_SCAN_INTERVAL_MINUTES
        value: 15
      - key: CYCLICAL_SOCIAL_AUTO_POST
        value: "true"
      - key: CYCLICAL_SOCIAL_DRY_RUN
        value: "true"
      - key: CYCLICAL_BINANCE_AI_BOT_DRY_RUN
        value: "true"
